# E3 实验组：YOLOv8n + CBAM（仅在颈部 P3/P4/P5 三个尺度后各插 1 处，共 3 处）
# 主干(backbone)保持原版不变，无 CBAM。
# 相比原版 yolov8.yaml 改 3 处：在 P3/P4/P5 三个 C2f 之后各加一行 CBAM，
# 并让 Detect 的输入从三个 C2f 输出改成三个 CBAM 输出。
#
# 重要提醒：CBAM 通道参数不会被 width_multiple 自动缩放，必须写真实运行时通道数：
#   P3 = 64、P4 = 128、P5 = 256。
nc: 1
scales:
  n: [0.33, 0.25, 1024]   # depth 系数, width 系数, 最大通道数

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0
  - [-1, 1, Conv, [128, 3, 2]]     # 1
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9  主干最深层（E3 不在此插 CBAM）

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11  与主干第6行(P4)拼接
  - [-1, 3, C2f, [512]]                          # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14  与主干第4行(P3)拼接
  - [-1, 3, C2f, [256]]                          # 15  P3 特征，输出 64
  - [-1, 1, CBAM, [64]]                          # 16 ← 颈部 P3 注意力
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 12], 1, Concat, [1]]                   # 18
  - [-1, 3, C2f, [512]]                          # 19  P4 特征，输出 128
  - [-1, 1, CBAM, [128]]                         # 20 ← 颈部 P4 注意力
  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 9], 1, Concat, [1]]                    # 22  与主干第9行(SPPF)拼接，索引不变
  - [-1, 3, C2f, [1024]]                         # 23  P5 特征，输出 256
  - [-1, 1, CBAM, [256]]                         # 24 ← 颈部 P5 注意力
  - [[16, 20, 24], 1, Detect, [nc]]              # 25  从三个 CBAM 输出做检测