# E4 实验组（提出方法）：YOLOv8n + CBAM（主干 1 处 + 颈部 3 处，共 4 处）
# 主干：SPPF 之后插 1 处 CBAM
# 颈部：P3/P4/P5 三个尺度各插 1 处 CBAM
###
# 重要提醒：CBAM 通道参数不会被 width_multiple 自动缩放，必须写真实运行时通道数：
#   主干深层 = 256、P3 = 64、P4 = 128、P5 = 256。
nc: 1
scales:
  n: [0.33, 0.25, 1024]   # depth 系数, width 系数, 最大通道数

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2，输出 16
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4，输出 32
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8，输出 64
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5  P4/16，输出 128
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7  P5/32，输出 256
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9  主干最深层，输出 256
  - [-1, 1, CBAM, [256]]           # 10 ← 主干注意力层

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12  与主干第6行(P4)拼接
  - [-1, 3, C2f, [512]]                          # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15  与主干第4行(P3)拼接
  - [-1, 3, C2f, [256]]                          # 16  P3 特征，输出 64
  - [-1, 1, CBAM, [64]]                          # 17 ← 颈部 P3 注意力
  - [-1, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 13], 1, Concat, [1]]                   # 19
  - [-1, 3, C2f, [512]]                          # 20  P4 特征，输出 128
  - [-1, 1, CBAM, [128]]                         # 21 ← 颈部 P4 注意力
  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 10], 1, Concat, [1]]                   # 23  与主干第10行(CBAM)拼接，索引由9改10
  - [-1, 3, C2f, [1024]]                         # 24  P5 特征，输出 256
  - [-1, 1, CBAM, [256]]                         # 25 ← 颈部 P5 注意力
  - [[17, 21, 25], 1, Detect, [nc]]              # 26  从三个 CBAM 输出做检测