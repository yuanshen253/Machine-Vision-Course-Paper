# E2 实验组：YOLOv8n + CBAM（仅主干 SPPF 之后插入 1 处）
# 相比原版 yolov8.yaml 只改 2 处：
#   ① backbone 末尾新增第 10 行 CBAM
#   ② neck 里 P5 的 Concat 来源由 SPPF(第9行) 改为 CBAM(第10行)
#
# 重要提醒：CBAM 的通道参数不会被 width_multiple 自动缩放，
# 所以 [256] 必须是真实运行时通道数（1024 × 0.25 = 256），
# 不能照抄旁边 C2f/SPPF 里写的满宽度数字。
nc: 1
scales:
  n: [0.33, 0.25, 1024]   # depth 系数, width 系数, 最大通道数

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2，输出 16
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4，输出 32
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8，输出 64
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5  P4/16，输出 128
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7  P5/32，输出 256
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9  主干最深层，输出 256
  - [-1, 1, CBAM, [256]]           # 10 ← ① 唯一新增：主干注意力层

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12  与主干第6行(P4)拼接
  - [-1, 3, C2f, [512]]                          # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15  与主干第4行(P3)拼接
  - [-1, 3, C2f, [256]]                          # 16  P3 特征，输出 64
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 3, C2f, [512]]                          # 19  P4 特征，输出 128
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21 ← ② 改这里：9 → 10，让检测头用上 CBAM 输出
  - [-1, 3, C2f, [1024]]                         # 22  P5 特征，输出 256
  - [[16, 19, 22], 1, Detect, [nc]]              # 23  从 P3/P4/P5 三个尺度检测